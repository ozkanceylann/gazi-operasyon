<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Sipariş Operasyon · Giriş</title>
  <script src="config.js"></script>
  <style>
    :root{color-scheme:light;--green:#133d2d;--gold:#e8c875;--ink:#183c2d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px 16px;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 15%,#285c43 0,transparent 58%),linear-gradient(145deg,#09291e,#133d2d 55%,#061e17);position:relative;isolation:isolate}
    body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.11;background-image:repeating-linear-gradient(45deg,transparent 0 39px,#e8c875 40px,transparent 41px 80px),repeating-linear-gradient(-45deg,transparent 0 39px,#e8c875 40px,transparent 41px 80px);mask-image:linear-gradient(to bottom,#000,transparent 65%,#000)}
    .login-box{width:100%;max-width:420px;position:relative;background:linear-gradient(135deg,#fff1bd,#efd48e 48%,#d7b262);padding:34px 34px 30px;border:1px solid #f8e2a5;border-radius:24px;box-shadow:0 24px 75px #0005,inset 0 1px 0 #fff9;text-align:center}
    .login-box::before{content:"";position:absolute;inset:9px;border:1px solid #94722d55;border-radius:17px;pointer-events:none}
    .logo{width:140px;max-height:100px;object-fit:contain;display:block;margin:0 auto 16px}
    .brand-caption{margin:0 0 8px;font-size:10px;letter-spacing:2.4px;font-weight:700;color:#6a542b;text-transform:uppercase}
    h2{color:var(--green);font-family:"Segoe Script","URW Chancery L","Brush Script MT",Georgia,serif;font-style:italic;font-weight:600;font-size:34px;line-height:1.3;margin:0}
    .login-subtitle{font-size:14px;letter-spacing:.7px;margin:3px 0 16px;font-weight:600}
    .ornament{display:flex;align-items:center;justify-content:center;gap:12px;color:#95742f;margin:0 0 22px;font-size:12px}
    .ornament::before,.ornament::after{content:"";width:68px;height:1px;background:linear-gradient(90deg,transparent,#95742f)}
    .ornament::after{transform:rotate(180deg)}
    .form-group{margin-bottom:16px;text-align:left}
    label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:#284332}
    input{display:block;width:100%;padding:13px 14px;border-radius:11px;border:1px solid #b79b5766;font-size:15px;background:#fffbf0;color:#183c2d;box-shadow:inset 0 1px 2px #9272310a;transition:border-color .15s,box-shadow .15s}
    input::placeholder{color:#8e8b7b}
    input:focus{outline:none;border-color:#42684b;box-shadow:0 0 0 3px #133d2d1a;background:#fffdf5}
    .btn-login{width:100%;padding:14px;border:1px solid #315c43;border-radius:11px;background:linear-gradient(135deg,#1c4b35,#0d3022);color:#f9e3a3;font-size:15px;font-weight:700;letter-spacing:.4px;cursor:pointer;margin-top:5px;box-shadow:0 5px 12px #17342622}
    .btn-login:hover{background:#1b5038}
    .btn-login:focus-visible{outline:3px solid #66835a;outline-offset:3px}
    .error{margin-top:14px;color:#8b2424;display:none;font-size:13px;line-height:1.6;padding:10px;border:1px solid #a8323233;background:#fff5eb;border-radius:8px}
    .login-footer{font-size:11px;color:#6a542b;margin:20px 0 0}
    @media(max-width:480px){.login-box{padding:28px 25px 26px}h2{font-size:30px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}

  </style>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/siparis-operasyon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/siparis-operasyon-192.png">
  <meta name="application-name" content="Sipariş Operasyon">
  <meta name="theme-color" content="#142219">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sipariş Operasyon">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/install-app.css?v=20261016-pwa-52">
  <script src="/install-app.js?v=20261016-pwa-52" defer></script>
  <link rel="stylesheet" href="theme.css?v=20261020-all-press-feedback-92">
<link rel="stylesheet" href="viewport-lock.css?v=20261025-fixed-screen-1">
<script src="viewport-lock.js?v=20261025-fixed-screen-1"></script>
</head>
<body class="login-page">
  <div class="login-box">
    <img id="brandLogo" class="logo" alt="Logo">
    <p class="brand-caption">SİPARİŞ YÖNETİMİ</p>
    <h2 id="brandTitle">Gazi</h2>
    <p class="login-subtitle">Sipariş Operasyon</p>
    <div class="ornament" aria-hidden="true">◆</div>

    <div class="form-group">
      <label for="email">E-posta</label>
      <input id="email" type="email" autocomplete="username" placeholder="Email adresiniz">
    </div>
    <div class="form-group">
      <label for="password">Şifre</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Şifreniz">
    </div>

    <button class="btn-login" onclick="login()">Giriş Yap</button>
    <div id="errorBox" class="error" role="alert"></div>
    <button id="installAppBtn" type="button" hidden><img src="/icons/siparis-operasyon-192.png" alt="">Ana Ekrana Ekle</button>
    <p class="login-footer">Gazioğulları · Sipariş Takip Paneli</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (async()=>{
      await window.waitConfig();
      document.getElementById("brandLogo").src = CONFIG.logo;
      document.getElementById("brandTitle").innerText = CONFIG.brandName.charAt(0).toLocaleUpperCase("tr-TR") + CONFIG.brandName.slice(1);
    })();

    const db = supabase.createClient(
      "https://jarsxtpqzqzhlshpmgot.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphcnN4dHBxenF6aGxzaHBtZ290Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyODExMTcsImV4cCI6MjA3Nzg1NzExN30.98oYONSkb8XSDrfGW2FxhFmt2BLB5ZRo3Ho50GhZYgE"
    );

    async function login(){
      await window.waitConfig();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorBox = document.getElementById("errorBox"); errorBox.style.display="none";

      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if(error){ errorBox.textContent="Hatalı email veya şifre!"; errorBox.style.display="block"; return; }

      const meta = data.user.app_metadata || {};
      if(!meta.firma || String(meta.firma).trim().toLowerCase() !== CONFIG.brand.toLowerCase()){
        errorBox.textContent = "Bu panele sadece " + CONFIG.brandName + " kullanıcıları girebilir!";
        errorBox.style.display="block";
        await db.auth.signOut({ scope: "local" });
        return;
      }

      localStorage.setItem("firma", meta.firma.toLowerCase());
      localStorage.setItem("rol", meta.rol || "");
      // Supabase kendi oturumunu saklar; ayrıca token kopyası tutulmaz.
      location.href="index.html";
    }
    window.login = login;
    document.querySelectorAll("input").forEach(input=>input.addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();login();}}));
  </script>
    <!-- SAYFA İÇERİĞİ -->

  <!-- 🔁 SERVICE WORKER AUTO UPDATE -->
  <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js").then(reg => {

      reg.addEventListener("updatefound", () => {
        const newWorker = reg.installing;
        if (!newWorker) return;

        newWorker.addEventListener("statechange", () => {
          if (newWorker.state === "activated") {
            if (navigator.serviceWorker.controller) {
              console.log("🔄 Yeni sürüm aktif → yenileniyor");
              location.reload();
            }
          }
        });
      });

    });
  }
  </script>
</body>
</html>
