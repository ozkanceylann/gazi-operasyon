<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Etiket Tasarımı · Gazi Operasyon</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css?v=20261126-shipping-control-fullwidth">
  <link rel="stylesheet" href="theme.css?v=20261121-web-orders-94">
  <link rel="stylesheet" href="viewport-lock.css?v=20261025-fixed-screen-1">
  <script src="viewport-lock.js?v=20261025-fixed-screen-1"></script>
  <style id="printPageRules"></style>
  <style>
    .label-maker{max-width:1440px;margin:0 auto;padding:24px}
    .label-top{display:flex;align-items:center;gap:16px;margin-bottom:20px}
    .label-top a{color:var(--ui-accent-ink,#efd39b);text-decoration:none}
    .label-top h1{margin:0;color:var(--ui-ink,#f4f1e5);font-size:26px}
    .label-layout{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);gap:20px;align-items:start}
    .label-card{background:var(--ui-paper,#142219);border:1px solid var(--ui-line,#48604a);border-radius:16px;padding:20px;box-shadow:0 6px 18px #0002}
    .label-card h2{margin:0 0 16px;font-size:17px;color:var(--ui-accent-ink,#efd39b)}
    .label-form{display:grid;gap:14px}
    .label-field{display:grid;gap:6px;color:var(--ui-ink,#f4f1e5);font-size:13px;font-weight:650}
    .label-field input,.label-field textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--ui-line,#48604a);border-radius:9px;background:var(--ui-inset,#182b1e);color:var(--ui-ink,#f4f1e5);font:inherit}
    .label-field textarea{min-height:100px;resize:vertical;line-height:1.5}
    .label-field small,.label-help{font-size:12px;font-weight:400;line-height:1.5;color:var(--ui-muted,#a5b7a6)}
    .label-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .choice-field{display:grid;gap:7px;color:var(--ui-ink,#f4f1e5);font-size:13px;font-weight:650}
    .choice-row{display:flex;gap:8px}
    .choice-row button{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--ui-line,#48604a);border-radius:9px;background:var(--ui-inset,#182b1e);color:var(--ui-ink,#f4f1e5);font:inherit;cursor:pointer}
    .choice-row button[aria-pressed="true"]{border-color:#d4a857;background:#d4a857;color:#1a2a1f;font-weight:750}
    .label-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px}
    .label-actions button{padding:11px 16px;border:1px solid #d4a857;border-radius:10px;background:linear-gradient(110deg,#dfbd78,#c89845);color:#1a2a1f;font:inherit;font-weight:750;cursor:pointer}
    .label-actions button.secondary{background:#223728;color:#f4f1e5;border-color:#48604a}
    .label-summary{margin:0;padding:12px;border-radius:10px;background:#1a2c20;color:var(--ui-ink,#f4f1e5);font-size:13px;line-height:1.5}
    .label-preview-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
    .label-preview-head h2{margin:0}
    #previewDimensions{color:var(--ui-accent-ink,#efd39b);font-size:13px;font-weight:700;text-align:right}
    .page-viewport{padding:16px;border-radius:12px;background:#101a13;overflow:auto;max-height:75vh}
    .sheet{box-sizing:content-box;padding:0;background:#fff;color:#111;box-shadow:0 3px 18px #0004;display:grid;overflow:hidden;flex:none}
    .label-item{box-sizing:border-box;display:flex;align-items:center;justify-content:center;overflow:hidden;border:.2mm solid #aaa;padding:.6mm;color:#111;font-family:Arial,sans-serif;font-weight:700}
    .label-text{display:block;max-width:100%;max-height:100%;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;line-height:1.15;text-align:center}
    .label-text.rotated{transform:rotate(90deg);white-space:pre-wrap}
    #labelStatus{min-height:20px;margin:10px 0 0;color:var(--ui-muted,#a5b7a6);font-size:12px}
    @media(max-width:900px){.label-layout{grid-template-columns:1fr}.page-viewport{max-height:55vh}}
    @media(max-width:600px){.label-maker{padding:68px 14px 20px}.label-card{padding:15px}.label-top h1{font-size:22px}.label-pair{gap:8px}}
    @media print{
      html,body{margin:0!important;padding:0!important;background:#fff!important;color:#111!important}
      .label-maker{max-width:none;margin:0;padding:0}
      .label-top,.label-controls,.label-preview-head,#labelStatus{display:none!important}.page-viewport{display:block!important;margin:0!important;padding:0!important;background:#fff!important;max-height:none!important;overflow:visible!important}
      .label-layout,.label-card{display:block!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;max-height:none!important;overflow:visible!important;background:#fff!important}
      .sheet{margin:0!important;box-shadow:none!important;overflow:hidden!important}
      .label-item{border:.2mm solid #777!important}
    }
  </style>
</head>
<body class="orders-page">
  <main class="label-maker">
    <header class="label-top">
      <a href="index.html">← Siparişlere dön</a>
      <h1>Etiket Tasarımı ve Yazdırma</h1>
    </header>
    <div class="label-layout">
      <section class="label-card label-controls" aria-labelledby="designTitle">
        <h2 id="designTitle">Etiket bilgileri</h2>
        <form id="labelForm" class="label-form">
          <div class="label-pair">
            <label class="label-field" for="labelWidth">Kağıt yatay ölçüsü (mm)
              <input id="labelWidth" type="number" min="5" max="300" step="0.5" value="60" required>
            </label>
            <label class="label-field" for="labelHeight">Kağıt dikey ölçüsü (mm)
              <input id="labelHeight" type="number" min="5" max="300" step="0.5" value="30" required>
            </label>
          </div>
          <label class="label-field" for="labelText">Etikette yazacak metin
            <textarea id="labelText" maxlength="5000" placeholder="ÜRT. T: 20.11.2026">ÜRT. T: 20.11.2026
S.K.T. : 20.11.2028
NET: 5 Kg ℮</textarea>
            <small>Enter aynı bölmenin içinde alt satıra geçirir. Girilen metin seçtiğiniz bölme sayısı kadar tekrarlanır.</small>
          </label>
          <div class="choice-field">Yazı yönü
            <div class="choice-row" role="group" aria-label="Yazı yönü">
              <button type="button" data-choice="text" data-value="horizontal" aria-pressed="true">Yatay</button>
              <button type="button" data-choice="text" data-value="vertical" aria-pressed="false">Dikey</button>
            </div>
          </div>
          <div class="label-pair">
            <label class="label-field" for="horizontalDivisions">Yatay bölme sayısı
              <input id="horizontalDivisions" type="number" min="1" max="100" step="1" value="1" required>
            </label>
            <label class="label-field" for="verticalDivisions">Dikey bölme sayısı
              <input id="verticalDivisions" type="number" min="1" max="100" step="1" value="4" required>
            </label>
          </div>
          <p id="capacitySummary" class="label-summary" aria-live="polite"></p>
          <p class="label-help">Yazdırma boyutu, girdiğiniz yatay × dikey ölçüdür. Yazıcı ayarlarında gerçek boyut (%100) seçin.</p>
          <div class="label-actions">
            <button type="submit">Yazdır</button>
            <button type="button" class="secondary" id="resetLabel">Varsayılana dön</button>
          </div>
        </form>
        <p id="labelStatus" role="status" aria-live="polite">Oturum kontrol ediliyor…</p>
      </section>
      <section class="label-card" aria-labelledby="previewTitle">
        <div class="label-preview-head">
          <h2 id="previewTitle">Etiket önizleme</h2>
          <span id="previewDimensions"></span>
        </div>
        <div class="page-viewport"><div id="previewSheet" class="sheet" aria-label="Etiket baskı önizlemesi"></div></div>
      </section>
    </div>
  </main>
  <script>
    (async function(){
      const status=document.getElementById('labelStatus');
      try{
        await window.waitConfig();
        const db=window.supabase.createClient('https://jarsxtpqzqzhlshpmgot.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphcnN4dHBxenF6aGxzaHBtZ290Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyODExMTcsImV4cCI6MjA3Nzg1NzExN30.98oYONSkb8XSDrfGW2FxhFmt2BLB5ZRo3Ho50GhZYgE');
        await window.requireSession(db);
        status.textContent='';
      }catch(error){status.textContent=error.message||'Oturum doğrulanamadı.';return;}
      const width=document.getElementById('labelWidth'),height=document.getElementById('labelHeight');
      const columnsInput=document.getElementById('horizontalDivisions'),rowsInput=document.getElementById('verticalDivisions'),text=document.getElementById('labelText');
      const sheet=document.getElementById('previewSheet'),summary=document.getElementById('capacitySummary');
      const dimensions=document.getElementById('previewDimensions'),printRules=document.getElementById('printPageRules');
      let textDirection='horizontal';
      function positive(input,fallback){const n=Number(input.value);return Number.isFinite(n)&&n>0?n:fallback;}
      function fitFontSize(value,boxW,boxH,rotated){
        const availableW=(rotated?boxH:boxW)*96/25.4-4;
        const availableH=(rotated?boxW:boxH)*96/25.4-4;
        const lines=value.split(/\r?\n/);
        let size=16;
        for(;size>5;size-=.5){
          const charsPerLine=Math.max(1,Math.floor(availableW/(size*.58)));
          const wrapped=lines.reduce((total,line)=>total+Math.max(1,Math.ceil(line.length/charsPerLine)),0);
          if(wrapped*size*1.2<=availableH)break;
        }
        return Math.max(5,Math.min(16,size));
      }
      function draw(){
        const w=positive(width,60),h=positive(height,30);
        const columns=Math.min(100,Math.max(1,Math.floor(positive(columnsInput,1))));
        const rows=Math.min(100,Math.max(1,Math.floor(positive(rowsInput,4))));
        const count=columns*rows;
        sheet.replaceChildren();
        sheet.style.width=w+'mm';sheet.style.height=h+'mm';
        sheet.style.gridTemplateColumns='repeat('+columns+',1fr)';
        sheet.style.gridTemplateRows='repeat('+rows+',1fr)';
        printRules.textContent='@page{size:'+w+'mm '+h+'mm;margin:0}';
        dimensions.textContent=w+' × '+h+' mm';
        const segmentW=w/columns,segmentH=h/rows;
        summary.textContent='Etiket '+columns+' yatay × '+rows+' dikey bölmeye ayrılır; toplam '+count+' bölme. Her bölme '+segmentW.toFixed(1)+' × '+segmentH.toFixed(1)+' mm olur.';
        const value=text.value;
        for(let i=0;i<count;i++){
          const cell=document.createElement('div');cell.className='label-item';
          const content=document.createElement('span');content.className='label-text';
          content.textContent=value;content.classList.toggle('rotated',textDirection==='vertical');
          content.style.fontSize=fitFontSize(value,segmentW,segmentH,textDirection==='vertical')+'px';
          cell.appendChild(content);sheet.appendChild(cell);
        }
      }
      document.getElementById('labelForm').addEventListener('input',draw);
      document.querySelectorAll('[data-choice="text"]').forEach(button=>button.addEventListener('click',()=>{
        textDirection=button.dataset.value;
        document.querySelectorAll('[data-choice="text"]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
        draw();
      }));
      document.getElementById('labelForm').addEventListener('submit',event=>{
        event.preventDefault();
        if(!text.value.trim()){status.textContent='Yazdırmak için etiket metni girin.';text.focus();return;}
        status.textContent='Yazdırma penceresi açılıyor…';
        window.print();
        setTimeout(()=>{status.textContent='Yazdırma tamamlandıysa etiketi yazıcıdan alabilirsiniz.';},500);
      });
      document.getElementById('resetLabel').addEventListener('click',()=>{
        width.value='60';height.value='30';columnsInput.value='1';rowsInput.value='4';text.value='ÜRT. T: 20.11.2026\nS.K.T. : 20.11.2028\nNET: 5 Kg ℮';
        textDirection='horizontal';
        document.querySelectorAll('[data-choice="text"]').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.value==='horizontal')));
        draw();
      });
      window.addEventListener('beforeprint',draw);
      draw();
    })();
  </script>
</body>
</html>
