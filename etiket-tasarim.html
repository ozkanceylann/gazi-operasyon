<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Etiket Tasarımı · Gazi Operasyon</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css?v=20261126-shipping-control-fullwidth">
  <link rel="stylesheet" href="theme.css?v=20261121-web-orders-94">
  <link rel="stylesheet" href="viewport-lock.css?v=20261025-fixed-screen-1">
  <script src="viewport-lock.js?v=20261025-fixed-screen-1"></script>
  <style id="printPageRules"></style>
  <style>
    .label-maker{max-width:1440px;margin:0 auto;padding:24px}
    .label-top{display:flex;align-items:center;gap:16px;margin-bottom:20px}
    .label-top a{color:var(--ui-accent-ink,#efd39b);text-decoration:none}
    .label-top h1{margin:0;color:var(--ui-ink,#f4f1e5);font-size:26px}
    .label-layout{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);gap:20px;align-items:start}
    .label-card{background:var(--ui-paper,#142219);border:1px solid var(--ui-line,#48604a);border-radius:16px;padding:20px;box-shadow:0 6px 18px #0002}
    .label-card h2{margin:0 0 16px;font-size:17px;color:var(--ui-accent-ink,#efd39b)}
    .label-form{display:grid;gap:14px}
    .label-field{display:grid;gap:6px;color:var(--ui-ink,#f4f1e5);font-size:13px;font-weight:650}
    .label-field input,.label-field textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--ui-line,#48604a);border-radius:9px;background:var(--ui-inset,#182b1e);color:var(--ui-ink,#f4f1e5);font:inherit}
    .label-field textarea{min-height:100px;resize:vertical;line-height:1.5}
    .label-field small,.label-help{font-size:12px;font-weight:400;line-height:1.5;color:var(--ui-muted,#a5b7a6)}
    .label-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .choice-field{display:grid;gap:7px;color:var(--ui-ink,#f4f1e5);font-size:13px;font-weight:650}
    .choice-row{display:flex;gap:8px}
    .choice-row button{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--ui-line,#48604a);border-radius:9px;background:var(--ui-inset,#182b1e);color:var(--ui-ink,#f4f1e5);font:inherit;cursor:pointer}
    .choice-row button[aria-pressed="true"]{border-color:#d4a857;background:#d4a857;color:#1a2a1f;font-weight:750}
    .label-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px}
    .label-actions button{padding:11px 16px;border:1px solid #d4a857;border-radius:10px;background:linear-gradient(110deg,#dfbd78,#c89845);color:#1a2a1f;font:inherit;font-weight:750;cursor:pointer}
    .label-actions button.secondary{background:#223728;color:#f4f1e5;border-color:#48604a}
    .label-summary{margin:0;padding:12px;border-radius:10px;background:#1a2c20;color:var(--ui-ink,#f4f1e5);font-size:13px;line-height:1.5}
    .label-preview-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
    .label-preview-head h2{margin:0}
    #previewDimensions{color:var(--ui-accent-ink,#efd39b);font-size:13px;font-weight:700;text-align:right}
    .page-viewport{padding:16px;border-radius:12px;background:#101a13;overflow:auto;max-height:75vh}
    .sheet{box-sizing:content-box;padding:0;background:#fff;color:#111;box-shadow:0 3px 18px #0004;display:grid;overflow:hidden;flex:none}
    .label-item{box-sizing:border-box;position:relative;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;border:.2mm solid #aaa;padding:0;color:#111;font-family:Arial,sans-serif;font-weight:700}
    .label-text{display:block;max-width:100%;max-height:100%;white-space:pre;overflow-wrap:normal;word-break:normal;line-height:1.15;text-align:left}
    .label-text.rotated{position:absolute;left:0;top:0;max-width:none;max-height:none;transform-origin:top left;white-space:pre}
    #labelStatus{min-height:20px;margin:10px 0 0;color:var(--ui-muted,#a5b7a6);font-size:12px}
    .pdf-preview-panel{margin-top:20px}
    .pdf-preview-panel[hidden]{display:none!important}
    #pdfFrame{display:block;width:100%;height:min(70vh,720px);min-height:360px;border:1px solid var(--ui-line,#48604a);border-radius:10px;background:#fff}

    @media(max-width:900px){.label-layout{grid-template-columns:1fr}.page-viewport{max-height:55vh}}
    @media(max-width:600px){.label-maker{padding:68px 14px 20px}.label-card{padding:15px}.label-top h1{font-size:22px}.label-pair{gap:8px}}
    @media print{
      html,body{margin:0!important;padding:0!important;background:#fff!important;color:#111!important}
      .label-maker{max-width:none;margin:0;padding:0}
      .label-top,.label-controls,.label-preview-head,#labelStatus{display:none!important}.page-viewport{display:block!important;margin:0!important;padding:0!important;background:#fff!important;max-height:none!important;overflow:visible!important}
      .label-layout,.label-card{display:block!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;max-height:none!important;overflow:visible!important;background:#fff!important}
      .sheet{margin:0!important;box-shadow:none!important;overflow:hidden!important}
      .label-item{border:.2mm solid #777!important}
    }
  </style>
</head>
<body class="orders-page">
  <main class="label-maker">
    <header class="label-top">
      <a href="index.html">← Siparişlere dön</a>
      <h1>Etiket Tasarımı ve Yazdırma</h1>
    </header>
    <div class="label-layout">
      <section class="label-card label-controls" aria-labelledby="designTitle">
        <h2 id="designTitle">Etiket bilgileri</h2>
        <form id="labelForm" class="label-form">
          <div class="label-pair">
            <label class="label-field" for="labelWidth">Kağıt yatay ölçüsü (mm)
              <input id="labelWidth" type="number" min="5" max="300" step="0.5" value="60" required>
            </label>
            <label class="label-field" for="labelHeight">Kağıt dikey ölçüsü (mm)
              <input id="labelHeight" type="number" min="5" max="300" step="0.5" value="30" required>
            </label>
          </div>
          <label class="label-field" for="labelText">Etikette yazacak metin
            <textarea id="labelText" maxlength="5000" placeholder="ÜRT. T: 20.11.2026">ÜRT. T: 20.11.2026
S.K.T. : 20.11.2028
NET: 5 Kg ℮</textarea>
            <small>Enter aynı bölmenin içinde alt satıra geçirir. Girilen metin seçtiğiniz bölme sayısı kadar tekrarlanır.</small>
          </label>
          <div class="choice-field">Yazı yönü
            <div class="choice-row" role="group" aria-label="Yazı yönü">
              <button type="button" data-choice="text" data-value="horizontal" aria-pressed="false">Yatay</button>
              <button type="button" data-choice="text" data-value="vertical" aria-pressed="true">Dikey</button>
            </div>
          </div>
          <div class="label-pair">
            <label class="label-field" for="horizontalDivisions">Yatay bölme sayısı
              <input id="horizontalDivisions" type="number" min="1" max="100" step="1" value="4" required>
            </label>
            <label class="label-field" for="verticalDivisions">Dikey bölme sayısı
              <input id="verticalDivisions" type="number" min="1" max="100" step="1" value="1" required>
            </label>
          </div>
          <div class="label-pair">
            <label class="label-field" for="horizontalGap">Yatay aralık (mm)
              <input id="horizontalGap" type="number" min="0" max="100" step="0.5" value="0" required>
            </label>
            <label class="label-field" for="verticalGap">Dikey aralık (mm)
              <input id="verticalGap" type="number" min="0" max="100" step="0.5" value="0" required>
            </label>
          </div>
          <label class="label-field" for="labelFontSize">Yazı puntosu
            <input id="labelFontSize" type="number" min="4" max="72" step="0.5" value="12" required>
            <small>Seçilen punto bölmeye sığmazsa yazı otomatik küçültülür.</small>
          </label>
          <p id="capacitySummary" class="label-summary" aria-live="polite"></p>
          <p class="label-help">Yazdırma boyutu, girdiğiniz yatay × dikey ölçüdür. Yazıcı ayarlarında gerçek boyut (%100) seçin.</p>
          <div class="label-actions">
            <button type="submit">PDF Oluştur ve Önizle</button>
            <button type="button" class="secondary" id="resetLabel">Varsayılana dön</button>
          </div>
        </form>
        <p id="labelStatus" role="status" aria-live="polite">Oturum kontrol ediliyor…</p>
      </section>
      <section class="label-card" aria-labelledby="previewTitle">
        <div class="label-preview-head">
          <h2 id="previewTitle">Etiket önizleme</h2>
          <span id="previewDimensions"></span>
        </div>
        <div class="page-viewport"><div id="previewSheet" class="sheet" aria-label="Etiket baskı önizlemesi"></div></div>
      </section>
    </div>
    <section id="pdfPreviewPanel" class="label-card pdf-preview-panel" hidden aria-labelledby="pdfPreviewTitle">
      <div class="label-preview-head">
        <h2 id="pdfPreviewTitle">PDF önizleme</h2>
        <span id="pdfPageSize"></span>
      </div>
      <iframe id="pdfFrame" title="Etiket PDF önizlemesi"></iframe>
      <div class="label-actions">
        <button type="button" id="downloadPdf">PDF indir</button>
        <button type="button" id="printPdf">PDF'i aç / yazdır</button>
        <button type="button" class="secondary" id="closePdf">Önizlemeyi kapat</button>
      </div>
    </section>
  </main>
  <script>
    (async function(){
      const status=document.getElementById('labelStatus');
      try{
        await window.waitConfig();
        const db=window.supabase.createClient('https://jarsxtpqzqzhlshpmgot.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphcnN4dHBxenF6aGxzaHBtZ290Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyODExMTcsImV4cCI6MjA3Nzg1NzExN30.98oYONSkb8XSDrfGW2FxhFmt2BLB5ZRo3Ho50GhZYgE');
        await window.requireSession(db);
        status.textContent='';
      }catch(error){status.textContent=error.message||'Oturum doğrulanamadı.';return;}
      const width=document.getElementById('labelWidth'),height=document.getElementById('labelHeight');
      const columnsInput=document.getElementById('horizontalDivisions'),rowsInput=document.getElementById('verticalDivisions');
      const horizontalGapInput=document.getElementById('horizontalGap'),verticalGapInput=document.getElementById('verticalGap');
      const fontSizeInput=document.getElementById('labelFontSize'),text=document.getElementById('labelText');
      const sheet=document.getElementById('previewSheet'),summary=document.getElementById('capacitySummary');
      const dimensions=document.getElementById('previewDimensions'),printRules=document.getElementById('printPageRules');
      let textDirection='vertical',currentPdfUrl=null;
      function positive(input,fallback){const n=Number(input.value);return Number.isFinite(n)&&n>0?n:fallback;}
      function fitFontSize(value,boxW,boxH,rotated,requestedPt){
        const availableW=Math.max(1,(rotated?boxH:boxW)*96/25.4-4);
        const availableH=Math.max(1,(rotated?boxW:boxH)*96/25.4-4);
        const lines=value.split(/\r\n|\n|\r/);
        const maxSize=Math.min(72,Math.max(4,Number(requestedPt)||12))*96/72;
        const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
        let size=maxSize;
        for(;size>1;size-=.25){
          ctx.font='700 '+size+'px Arial';
          const widest=lines.reduce((max,line)=>Math.max(max,ctx.measureText(line).width),0);
          const textHeight=lines.length*size*1.15;
          if(widest<=availableW&&textHeight<=availableH)break;
        }
        return Math.max(1,Math.min(maxSize,size));
      }
      function draw(){
        const w=positive(width,60),h=positive(height,30);
        const columns=Math.min(100,Math.max(1,Math.floor(positive(columnsInput,1))));
        const rows=Math.min(100,Math.max(1,Math.floor(positive(rowsInput,4))));
        const horizontalGap=Math.max(0,Number(horizontalGapInput.value)||0);
        const verticalGap=Math.max(0,Number(verticalGapInput.value)||0);
        const count=columns*rows;
        sheet.replaceChildren();
        sheet.style.width=w+'mm';sheet.style.height=h+'mm';
        sheet.style.gridTemplateColumns='repeat('+columns+',minmax(0,1fr))';
        sheet.style.gridTemplateRows='repeat('+rows+',minmax(0,1fr))';
        sheet.style.columnGap=horizontalGap+'mm';sheet.style.rowGap=verticalGap+'mm';
        printRules.textContent='@page{size:'+w+'mm '+h+'mm;margin:0}';
        dimensions.textContent=w+' × '+h+' mm';
        const segmentW=Math.max(0,(w-horizontalGap*(columns-1))/columns);
        const segmentH=Math.max(0,(h-verticalGap*(rows-1))/rows);
        summary.textContent='Etiket '+columns+' yatay × '+rows+' dikey bölme; toplam '+count+' bölme. Yatay aralık '+horizontalGap+' mm, dikey aralık '+verticalGap+' mm. Her bölme '+segmentW.toFixed(1)+' × '+segmentH.toFixed(1)+' mm.';
        const value=text.value;
        for(let i=0;i<count;i++){
          const cell=document.createElement('div');cell.className='label-item';
          const content=document.createElement('span');content.className='label-text';
          const rotated=textDirection==='vertical';
          content.textContent=value;content.classList.toggle('rotated',rotated);
          content.style.fontSize=fitFontSize(value,segmentW,segmentH,rotated,fontSizeInput.value)+'px';
          if(rotated){
            const rotatedWidth=Math.max(1,segmentH*96/25.4-2);
            const rotatedHeight=Math.max(1,segmentW*96/25.4-2);
            content.style.width=rotatedWidth+'px';content.style.height=rotatedHeight+'px';
            content.style.transform='translateX('+rotatedHeight+'px) rotate(90deg)';
          }
          cell.appendChild(content);sheet.appendChild(cell);
        }
      }
      function clearPdfPreview(){
        document.getElementById('pdfPreviewPanel').hidden=true;
        document.getElementById('pdfFrame').removeAttribute('src');
        if(currentPdfUrl){URL.revokeObjectURL(currentPdfUrl);currentPdfUrl=null;}
      }
      function canvasToPdf(canvas,pageWmm,pageHmm){
        const jpeg=canvas.toDataURL('image/jpeg',0.98);
        const binary=atob(jpeg.slice(jpeg.indexOf(',')+1));
        const imageBytes=new Uint8Array(binary.length);
        for(let i=0;i<binary.length;i++)imageBytes[i]=binary.charCodeAt(i);
        const enc=new TextEncoder(),parts=[];
        let offset=0;
        function push(bytes){parts.push(bytes);offset+=bytes.length;}
        function pushText(value){push(enc.encode(value));}
        const header=new Uint8Array([37,80,68,70,45,49,46,52,10,37,226,227,207,211,10]);
        push(header);
        const offsets=[0];
        offsets[1]=offset;pushText('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
        offsets[2]=offset;pushText('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
        const pageWpt=pageWmm*72/25.4,pageHpt=pageHmm*72/25.4;
        offsets[3]=offset;pushText('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pageWpt+' '+pageHpt+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n');
        offsets[4]=offset;
        pushText('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+canvas.width+' /Height '+canvas.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+imageBytes.length+' >>\nstream\n');
        push(imageBytes);pushText('\nendstream\nendobj\n');
        const stream=enc.encode('q\n'+pageWpt+' 0 0 '+pageHpt+' 0 0 cm\n/Im0 Do\nQ\n');
        offsets[5]=offset;pushText('5 0 obj\n<< /Length '+stream.length+' >>\nstream\n');push(stream);pushText('endstream\nendobj\n');
        const xrefOffset=offset;
        let xref='xref\n0 6\n0000000000 65535 f \n';
        for(let i=1;i<=5;i++)xref+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
        xref+='trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xrefOffset+'\n%%EOF';
        pushText(xref);
        const pdfBytes=new Uint8Array(offset);let cursor=0;
        for(const part of parts){pdfBytes.set(part,cursor);cursor+=part.length;}
        return new Blob([pdfBytes],{type:'application/pdf'});
      }
      function renderPdfCanvas(){
        const w=positive(width,60),h=positive(height,30);
        const columns=Math.min(100,Math.max(1,Math.floor(positive(columnsInput,4))));
        const rows=Math.min(100,Math.max(1,Math.floor(positive(rowsInput,1))));
        const gapX=Math.max(0,Number(horizontalGapInput.value)||0),gapY=Math.max(0,Number(verticalGapInput.value)||0);
        const segmentW=Math.max(0,(w-gapX*(columns-1))/columns);
        const segmentH=Math.max(0,(h-gapY*(rows-1))/rows);
        const dpi=300,scale=dpi/25.4;
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));
        const ctx=canvas.getContext('2d',{alpha:false});
        ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
        const value=text.value,lines=value.split(/\r\n|\n|\r/);
        const rotated=textDirection==='vertical';
        const cssFont=fitFontSize(value,segmentW,segmentH,rotated,fontSizeInput.value);
        const fontPx=cssFont*dpi/96,lineHeight=fontPx*1.15;
        ctx.fillStyle='#111';ctx.strokeStyle='#777';ctx.lineWidth=Math.max(1,.2*scale);
        for(let row=0;row<rows;row++)for(let col=0;col<columns;col++){
          const xMm=col*(segmentW+gapX),yMm=row*(segmentH+gapY);
          const x=xMm*scale,y=yMm*scale,cw=segmentW*scale,ch=segmentH*scale;
          ctx.strokeRect(x+.1*scale,y+.1*scale,Math.max(0,cw-.2*scale),Math.max(0,ch-.2*scale));
          ctx.save();
          if(rotated){ctx.translate(x+cw,y);ctx.rotate(Math.PI/2);}
          else ctx.translate(x,y);
          ctx.font='700 '+(cssFont*25.4/96)+'px Arial';ctx.textAlign='left';ctx.textBaseline='top';
          const pad=.25*scale;
          for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],pad,pad+i*lineHeight);
          ctx.restore();
        }
        return {canvas,width:w,height:h};
      }
      function createPdfPreview(){
        clearPdfPreview();
        if(!text.value.trim()){status.textContent='PDF hazırlamak için etiket metni girin.';text.focus();return;}
        status.textContent='Etiket boyutunda PDF hazırlanıyor…';
        try{
          const rendered=renderPdfCanvas();
          const blob=canvasToPdf(rendered.canvas,rendered.width,rendered.height);
          currentPdfUrl=URL.createObjectURL(blob);
          document.getElementById('pdfFrame').src=currentPdfUrl;
          const sizeTag=Math.round(rendered.width*10)/10+'x'+Math.round(rendered.height*10)/10+'mm';
          const download=document.getElementById('downloadPdf');
          download.onclick=()=>{
            const link=document.createElement('a');link.href=currentPdfUrl;link.download='etiket-'+sizeTag+'.pdf';link.click();
          };
          document.getElementById('pdfPageSize').textContent=sizeTag+' · Tek sayfa';
          document.getElementById('pdfPreviewPanel').hidden=false;
          status.textContent='PDF hazır. Önizlemeden etiketi kontrol edip indirebilir veya yazdırabilirsiniz.';
          document.getElementById('pdfPreviewPanel').scrollIntoView({behavior:'smooth',block:'start'});
        }catch(error){
          console.error(error);
          status.textContent='PDF hazırlanamadı. Ayarları kontrol edip yeniden deneyin.';
        }
      }
      document.getElementById('labelForm').addEventListener('input',()=>{clearPdfPreview();draw();});
      document.querySelectorAll('[data-choice="text"]').forEach(button=>button.addEventListener('click',()=>{
        textDirection=button.dataset.value;
        document.querySelectorAll('[data-choice="text"]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
        clearPdfPreview();draw();
      }));
      document.getElementById('labelForm').addEventListener('submit',event=>{
        event.preventDefault();createPdfPreview();
      });
      document.getElementById('printPdf').addEventListener('click',()=>{
        if(!currentPdfUrl)return;
        const opened=window.open(currentPdfUrl,'_blank');
        if(!opened)status.textContent='PDF önizlemesi açık. PDF görüntüleyicisindeki yazdır düğmesini kullanın.';
      });
      document.getElementById('closePdf').addEventListener('click',clearPdfPreview);
      document.getElementById('resetLabel').addEventListener('click',()=>{
        clearPdfPreview();width.value='60';height.value='30';columnsInput.value='4';rowsInput.value='1';horizontalGapInput.value='0';verticalGapInput.value='0';fontSizeInput.value='12';text.value='ÜRT. T: 20.11.2026\nS.K.T. : 20.11.2028\nNET: 5 Kg ℮';
        textDirection='vertical';
        document.querySelectorAll('[data-choice="text"]').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.value==='vertical')));
        draw();
      });
      draw();
    })();
  </script>
</body>
</html>
